name: Astra focused mobile checks

on:
  pull_request:

permissions:
  contents: read

# Supplementary slice feedback. The full protected Browser tests workflow
# remains unchanged and authoritative for merge and deployment.
jobs:
  astra-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/astra-*.test.mjs
      - name: Check training presentation, units, and all accents
        run: npx playwright test tests/astra-*.spec.js tests/appearance-v1.spec.js tests/active-workout-units.spec.js tests/workout-controls.spec.js tests/jorge-train-ui-refresh.spec.js tests/phase3-workout-hierarchy.spec.js tests/workout-session-controller.spec.js tests/settings-units.spec.js tests/set-removal.spec.js tests/progress.spec.js tests/exercise-picker.spec.js tests/workout-mode.spec.js tests/routines.spec.js tests/program-plan-bridge.spec.js tests/history-plan-nav-migration.spec.js tests/shells.spec.js tests/phase4g-independent-user.spec.js tests/goals-1c.spec.js tests/ekf2-workout-cards.spec.js tests/session-controller.spec.js tests/szw-presentation-library.spec.js tests/szw-six-day-routines.spec.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: astra-focused-mobile
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  astra-webkit:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Verify active interaction and presentation in iPhone WebKit
        env:
          BIG_GAINS_WEBKIT_QA: 'true'
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-astra-webkit
        run: npx playwright test --project=webkit --output=test-results-astra-webkit tests/astra-position.spec.js tests/astra-workout.spec.js tests/astra-picker.spec.js tests/astra-navigation.spec.js tests/astra-startup.spec.js tests/active-workout-units.spec.js tests/set-removal.spec.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: astra-webkit
          path: |
            playwright-report-astra-webkit/
            test-results-astra-webkit/
          retention-days: 7
