name: Deploy static site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Write browser-safe Supabase configuration
        if: ${{ vars.SUPABASE_URL != '' && vars.SUPABASE_PUBLISHABLE_KEY != '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/write-cloud-config.mjs

      - name: Validate static site
        shell: bash
        run: |
          test -f index.html
          test -f asset-manifest.js
          test -f app.js
          test -f retrospective-workout.js
          test -f retrospective-workout.css
          test -f service-worker.js
          test -f service-worker-core.js
          test -f cloud-sync.js
          test -f vendor/supabase.js
          test -f migration-preview.js
          test -f migration-preview.css
          node --input-type=module <<'NODE'
          await import('./asset-manifest.js');

          const manifest = globalThis.BIG_GAINS_ASSET_MANIFEST;
          if (!manifest || typeof manifest.release !== 'string' || !manifest.release.trim()) {
            throw new Error('asset-manifest.js must declare a non-empty release.');
          }

          const requiredAssets = [
            ['./migration-preview.js', manifest.scripts],
            ['./migration-preview.css', manifest.styles]
          ];
          for (const [asset, collection] of requiredAssets) {
            const isListed = collection.some(entry => entry.split('?')[0] === asset);
            const isCoreAsset = manifest.coreAssets.some(entry => entry.split('?')[0] === asset);
            if (!isListed || !isCoreAsset) {
              throw new Error(`asset-manifest.js must include ${asset}.`);
            }
          }
          NODE
          grep -Fq "logRetrospectiveWorkout" index.html
          grep -Fq "./service-worker.js" app.js
          grep -Fq "'./asset-manifest.js'" service-worker.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
