name: Train physical acceptance regression
on: [pull_request]
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/astra-physical-acceptance.spec.js --project=chromium --project=webkit
        env:
          BIG_GAINS_WEBKIT_QA: 'true'
      - name: Repeat picker history return in both engines
        run: npx playwright test tests/astra-physical-acceptance.spec.js --grep 'blank workout gets' --project=chromium --project=webkit --repeat-each=5 --output=test-results-picker-repeat
        env:
          BIG_GAINS_WEBKIT_QA: 'true'
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-picker-repeat
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: train-acceptance-evidence
          path: |
            test-results/
            playwright-report/
            test-results-picker-repeat/
            playwright-report-picker-repeat/
