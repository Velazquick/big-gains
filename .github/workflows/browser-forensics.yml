name: Browser failure forensics

# Additive diagnostic only. Does not replace or bypass protected Browser jobs.
on:
  push:
    branches: [reliability-completion-20261022]
    paths:
      - '.github/workflows/browser-forensics.yml'
      - 'scripts/diagnostics/**'

permissions:
  contents: read

jobs:
  native-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15]
        playwright: ['1.62.1', '1.64.1']
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install exact isolated diagnostic toolchain
        env:
          PW_VERSION: ${{ matrix.playwright }}
        run: |
          mkdir -p native-forensics
          npm install --prefix "$RUNNER_TEMP/native-forensics" --ignore-scripts --no-audit --no-fund "@playwright/test@$PW_VERSION"
          cp "$RUNNER_TEMP/native-forensics/package-lock.json" native-forensics/toolchain-lock.json
          cp "$RUNNER_TEMP/native-forensics/node_modules/playwright-core/browsers.json" native-forensics/browsers.json
          node --version > native-forensics/node-version.txt
          git rev-parse HEAD > native-forensics/source-sha.txt
          uname -a > native-forensics/uname.txt
          ps -Ao pid,ppid,stat,comm > native-forensics/processes-before.txt
      - name: Install original or comparison browser
        env:
          RUNNER_KIND: ${{ matrix.runner }}
        run: |
          if [ "$RUNNER_KIND" = macos-15 ]; then
            node "$RUNNER_TEMP/native-forensics/node_modules/playwright/cli.js" install --with-deps webkit
          else
            node "$RUNNER_TEMP/native-forensics/node_modules/playwright/cli.js" install --with-deps chromium
          fi
      - name: Execute frozen no-application native lifecycle cells
        env:
          RUNNER_KIND: ${{ matrix.runner }}
          BG_REPRO_PACKAGE: ${{ runner.temp }}/native-forensics/package.json
          DEBUG: pw:browser
        run: |
          if [ "$RUNNER_KIND" = macos-15 ]; then
            BG_REPRO_OUTPUT=native-forensics/worker-navigation.json node scripts/diagnostics/native-worker-navigation.mjs
          else
            BG_REPRO_OUTPUT=native-forensics/context-lifecycle.json node scripts/diagnostics/native-context-lifecycle.mjs
          fi
      - name: Capture final native process inventory
        if: always()
        run: ps -Ao pid,ppid,stat,comm > native-forensics/processes-after.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-forensics-${{ matrix.runner }}-${{ matrix.playwright }}
          path: native-forensics/
          if-no-files-found: error
          retention-days: 30
