name: Reliability native prefix diagnostics

# Supplementary bounded investigation. Never replaces protected Browser CI.
on:
  push:
    branches: [reliability-completion-20261022]
    paths:
      - '.github/workflows/reliability-native-prefix.yml'

permissions:
  contents: read

jobs:
  chromium-prefix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        observation: [control, sampled]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Record exact native binary and environment
        run: |
          mkdir -p native-prefix
          git rev-parse HEAD > native-prefix/source-sha.txt
          node --version > native-prefix/node-version.txt
          uname -a > native-prefix/uname.txt
          cp node_modules/playwright-core/browsers.json native-prefix/browsers.json
          cp package-lock.json native-prefix/toolchain-lock.json
          # Resolve from the installed headless-shell directory rather than
          # assuming the regular Chromium path identifies the launched binary.
          find "$HOME/.cache/ms-playwright" -type f -name chrome-headless-shell -exec sha256sum {} \; > native-prefix/executable-sha256.txt
          shell_path=$(find "$HOME/.cache/ms-playwright" -type f -name chrome-headless-shell -print -quit)
          test -n "$shell_path"
          ldd "$shell_path" > native-prefix/shared-libraries.txt
          awk '/=> \// {print $3} /^[[:space:]]*\// {print $1}' native-prefix/shared-libraries.txt | xargs -r sha256sum > native-prefix/library-sha256.txt
      - name: Original short timer prefix and Auth-to-preview suffix
        env:
          OBSERVATION: ${{ matrix.observation }}
          DEBUG: pw:browser
        run: |
          ulimit -c unlimited
          cat /proc/sys/kernel/core_pattern > native-prefix/core-pattern.txt
          final_status=0
          # Three independent browser lifetimes per fixed cell, zero retries.
          # Keep failures even when the remaining preregistered cells execute.
          for sample in 1 2 3; do
            for cell in timer suffix; do
              label="$OBSERVATION-$cell-$sample"
              monitor_pid=
              if [ "$OBSERVATION" = sampled ]; then
                (
                  while true; do
                    date -u +%FT%TZ
                    ps -eo pid,ppid,rss,nlwp,comm
                    for name in memory.current memory.peak memory.events pids.current pids.events; do
                      if [ -f "/sys/fs/cgroup/$name" ]; then echo "$name"; cat "/sys/fs/cgroup/$name"; fi
                    done
                    sleep 1
                  done
                ) > "native-prefix/$label-resources.txt" 2>&1 &
                monitor_pid=$!
              fi
              set +e
              if [ "$cell" = timer ]; then
                npx playwright test --project=chromium tests/alexa-timer-stuck-skip.spec.js --grep 'Alexa running rest|Alexa live deadline|Alexa expired-in-background|Alexa reload with a future deadline' --output="native-prefix/$label-results" > "native-prefix/$label.log" 2>&1
              else
                npx playwright test --project=chromium tests/ios-home-screen-auth.spec.js tests/jorge-train-ui-refresh.spec.js --grep 'Safari and installed Home Screen sessions remain isolated|pre-workout preview is mobile-safe' --output="native-prefix/$label-results" > "native-prefix/$label.log" 2>&1
              fi
              cell_status=$?
              set -e
              if [ -n "$monitor_pid" ]; then kill "$monitor_pid"; wait "$monitor_pid" || true; fi
              printf '%s %s\n' "$label" "$cell_status" >> native-prefix/exit-statuses.txt
              if [ "$cell_status" -ne 0 ]; then final_status=1; fi
            done
          done
          exit "$final_status"
      - name: Focused integrity and PWA regressions
        if: ${{ !cancelled() && matrix.observation == 'control' }}
        run: npx playwright test --project=chromium tests/workout-integrity.spec.js tests/reliability-import.spec.js tests/reliability-finish.spec.js tests/migration-preview.spec.js tests/pwa-update.spec.js --output=native-prefix/regression-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-prefix-${{ matrix.observation }}
          path: |
            native-prefix/
            playwright-report/
          if-no-files-found: error
          retention-days: 30
