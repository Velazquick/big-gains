name: Migration journal resilience

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-journal-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned real PostgREST
        run: |
          curl --fail --location --output "$RUNNER_TEMP/postgrest.tar.xz" https://github.com/PostgREST/postgrest/releases/download/v16.5/postgrest-v16.5-linux-static-x86-64.tar.xz
          printf '%s  %s\n' '5099e7ada38f9f6846cd87c14c5f158b7c165f1e9959665ad412e61f4dceba95' "$RUNNER_TEMP/postgrest.tar.xz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/journal-postgrest"
          tar -xf "$RUNNER_TEMP/postgrest.tar.xz" -C "$RUNNER_TEMP/journal-postgrest"
      - name: Verify atomic journal transitions with real schema and RLS
        env:
          PGPASSWORD: synthetic-journal-ci
          OPERATOR_TEST_PG_PORT: '5432'
          MIGRATION_JOURNAL_POSTGREST: ${{ runner.temp }}/journal-postgrest/postgrest
          MIGRATION_JOURNAL_EVIDENCE_DIR: ${{ runner.temp }}/journal-evidence
        run: npm run test:migration-journal
      - name: Verify existing database security and telemetry
        env:
          PGPASSWORD: synthetic-journal-ci
          OPERATOR_TEST_PG_PORT: '5432'
        run: node --test tests/operator-db.test.mjs tests/product-telemetry.test.mjs tests/conflict-resolution-retry.test.mjs tests/public-telemetry.test.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: migration-journal-evidence
          path: ${{ runner.temp }}/journal-evidence/
          retention-days: 14
