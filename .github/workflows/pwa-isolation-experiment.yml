name: PWA WebKit platform comparison
on:
  push:
    branches: [hotfix/pwa-update-lifecycle]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Compare five real-worker suites without retries
        env:
          BIG_GAINS_WEBKIT_QA: 'true'
          DEBUG: pw:browser
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-webkit
        run: npx playwright test --project=webkit --output=test-results-webkit --workers=1 --repeat-each=5 tests/custom-domain-transition.spec.js tests/pwa-update.spec.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: platform-${{ matrix.platform }}
          path: playwright-report-webkit/
          retention-days: 7
