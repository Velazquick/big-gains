name: PWA offline simulation experiment
on:
  push:
    branches: [hotfix/pwa-update-lifecycle]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [dropped, refused]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Compare five real-worker suites without retries
        env:
          BIG_GAINS_WEBKIT_QA: 'true'
          PWA_REFUSE_CONNECTIONS: ${{ matrix.mode == 'refused' && 'true' || 'false' }}
          DEBUG: pw:browser
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-webkit
        run: npx playwright test --project=webkit --output=test-results-webkit --workers=1 --repeat-each=5 tests/custom-domain-transition.spec.js tests/pwa-update.spec.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: offline-${{ matrix.mode }}
          path: playwright-report-webkit/
          retention-days: 7
