name: PWA browser isolation experiment
on:
  push:
    branches: [hotfix/pwa-update-lifecycle]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [shared, isolated]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.mode == 'shared' && '2313f431f32ed2b3dce4aba1f796bdf688023eef' || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Compare five real-worker suites without retries
        env:
          BIG_GAINS_WEBKIT_QA: 'true'
        run: npx playwright test --project=webkit --workers=1 --repeat-each=5 tests/custom-domain-transition.spec.js tests/pwa-update.spec.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: isolation-${{ matrix.mode }}
          path: playwright-report/
          retention-days: 7
