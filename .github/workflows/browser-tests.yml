name: Browser tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      appearance-postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-appearance-ci
          POSTGRES_DB: appearance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rehearse appearance migration and stale-write guards on synthetic rows
        env:
          PGPASSWORD: synthetic-appearance-ci
        run: psql -h localhost -U postgres -d appearance_test -f tests/appearance-contract.sql

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser tests
        run: npm test

      - name: Verify mobile custom-domain migration in WebKit
        env:
          BIG_GAINS_WEBKIT_QA: 'true'
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-webkit
        run: npx playwright test --project=webkit --output=test-results-webkit tests/custom-domain-transition.spec.js tests/ios-home-screen-auth.spec.js tests/fresh-device-recovery.spec.js

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-webkit/
          if-no-files-found: ignore
          retention-days: 7

  deploy-pages:
    needs: playwright
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
